services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: perepelkin-home:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DB_PATH: /app/data/perepelkin-home.db
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      # За Caddy HTTPS всегда true; для локального теста по http ставьте false
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      WEB_DIST: /app/apps/web/dist
      MODULES_DIR: /app/modules
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?задайте ADMIN_PASSWORD в .env}
    volumes:
      - data:/app/data
      # Каталог модулей — read-only: добавление модуля = положить manifest.json,
      # перезапустить контейнер, без пересборки образа.
      - ./modules:/app/modules:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/auth/me').then(r=>process.exit(r.status===401||r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:?задайте DOMAIN в .env (например, domo.example.com)}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  data:
  caddy_data:
  caddy_config:
